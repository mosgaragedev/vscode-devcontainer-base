name: Build & Push

on:
  push:
    branches: [main, release]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target (devcontainer | code-server | all)'
        default: 'all'

env:
  GHCR: ghcr.io/mosgaragedev/vscode-devcontainer-base
  DHUB: docker.io/mosgarage/vscode-devcontainer-base

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [devcontainer, code-server]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          DATE_TAG="$(date +%Y%m%d)"
          TAGS=""
          for REG in "${{ env.GHCR }}" "${{ env.DHUB }}"; do
            if [ "${{ matrix.target }}" = "devcontainer" ]; then
              TAGS="$TAGS,${REG}:latest"
              if [ "${{ github.ref_name }}" = "main" ]; then
                TAGS="$TAGS,${REG}:main"
              fi
            else
              TAGS="$TAGS,${REG}:code-server"
            fi
            TAGS="$TAGS,${REG}:${{ matrix.target }}-${DATE_TAG}"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              VER="${GITHUB_REF_NAME#v}"
              TAGS="$TAGS,${REG}:v${VER},${REG}:v${VER}-${{ matrix.target }}"
            fi
          done
          echo "tags=${TAGS#,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          build-args: |
            NODE_VERSION=22
            DOTNET_CHANNEL=10.0
            INSTALL_AI_TOOLS=true

  # Sanity-check the published devcontainer image on release tags.
  smoke-test:
    name: Smoke test devcontainer
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Verify tools inside the image
        run: |
          docker run --rm --entrypoint bash \
            ${{ env.GHCR }}:latest -c '
            set -e
            kubectl version --client
            helm version --short
            k9s version --short 2>/dev/null | head -1 || true
            yq --version
            git --version
            node --version
            python3 --version
            claude --version || echo "claude: skipped"
            echo "✓ Smoke test passed"'
