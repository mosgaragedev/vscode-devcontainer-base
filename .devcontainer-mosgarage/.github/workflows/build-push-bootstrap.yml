# =============================================================================
# CI/CD — Build & Push mosgarage/codeserver-base
#
# Triggers:
#   • Push to main (Dockerfile.bootstrap changes)
#   • Pull requests (build-only, no push)
#   • Manual dispatch
#   • Weekly schedule (Sunday 03:00 UTC) — picks up base image patches
#
# Pushes to:
#   • docker.io/mosgarage/codeserver-base
#   • ghcr.io/mosgarage/codeserver-base
# =============================================================================

name: Build & Push Bootstrap Image

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile.bootstrap'
      - '.github/workflows/build-push-bootstrap.yml'

  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile.bootstrap'
      - '.github/workflows/build-push-bootstrap.yml'

  workflow_dispatch:

  schedule:
    # Weekly rebuild — Sunday 03:00 UTC
    - cron: '0 3 * * 0'

env:
  IMAGE_NAME: codeserver-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Set up QEMU for multi-platform builds ────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── Set up Docker Buildx ─────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to DockerHub ───────────────────────────────────
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Login to GitHub Container Registry ───────────────────
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Extract metadata (tags, labels) ──────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/mosgarage/${{ env.IMAGE_NAME }}
            ghcr.io/mosgarage/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=ref,event=pr

      # ── Build & Push ─────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.bootstrap
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Verify image (post-push) ─────────────────────────────
      - name: Verify tools in image
        if: github.event_name != 'pull_request'
        run: |
          docker pull docker.io/mosgarage/${{ env.IMAGE_NAME }}:latest
          docker run --rm docker.io/mosgarage/${{ env.IMAGE_NAME }}:latest sh -c "
            echo '=== Docker ===' && docker --version &&
            echo '=== Git ===' && git --version &&
            echo '=== Git LFS ===' && git lfs --version &&
            echo '=== SSH ===' && ssh -V 2>&1 &&
            echo '=== Node.js ===' && node --version &&
            echo '=== npm ===' && npm --version &&
            echo '=== devcontainer CLI ===' && npx @devcontainers/cli --version &&
            echo '=== User ===' && whoami
          "
