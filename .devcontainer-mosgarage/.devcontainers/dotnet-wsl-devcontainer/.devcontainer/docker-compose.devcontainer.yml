# ╔══════════════════════════════════════════════════════════════════╗
# ║  mosgarage · docker-compose.devcontainer.yml                     ║
# ║  Overlay — extends docker-compose.yml for dev/IDE use.           ║
# ║  The 'devcontainer' service is the editor's shell.               ║
# ║  The 'mosgarage' service is OVERRIDDEN to idle (we run dotnet    ║
# ║  watch from inside the devcontainer instead of auto-starting it) ║
# ╚══════════════════════════════════════════════════════════════════╝

name: mosgarage

services:

  # ── Override control plane: keep deps alive but don't auto-start app
  # The IDE runs 'dotnet watch' directly for hot-reload debugging.
  mosgarage:
    # Replace the production entrypoint with a no-op so the container
    # stays alive but doesn't start the server (IDE does that)
    entrypoint: ["sleep", "infinity"]
    # Don't healthcheck the app — it isn't running yet
    healthcheck:
      disable: true

  # ── Dev container — the editor attaches here ──────────────────────
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.devcontainer
    volumes:
      # Source code — mount repo root into /workspace
      - ..:/workspace:cached

      # Persist NuGet package cache across rebuilds
      - nuget-cache:/root/.nuget/packages
      - dotnet-tools:/root/.dotnet/tools

      # Persist npm cache
      - npm-cache:/root/.npm

      # Docker socket — so 'docker compose' works from inside
      - /var/run/docker.sock:/var/run/docker.sock

      # Unix socket dir (mosgarage IPC)
      - /var/run:/var/run

      # ZSH history persistence
      - zsh-history:/root/.zsh_history

    networks:
      - mosgarage-net
      - traefik-net

    # Keep alive — editor process keeps it running
    command: sleep infinity

    environment:
      # ── .NET ────────────────────────────────────────────────────
      DOTNET_ENVIRONMENT:             Development
      ASPNETCORE_ENVIRONMENT:         Development
      ASPNETCORE_URLS:                "http://+:7070;http://+:7071"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT:    "1"
      NUGET_PACKAGES:                 /root/.nuget/packages

      # ── mosgarage platform ───────────────────────────────────────
      MOSGARAGE_ACCESS_URL:           "http://localhost:7070"
      MOSGARAGE_PG_CONNECTION:        "Host=database;Port=5432;Database=mosgarage;Username=mosgarage;Password=${POSTGRES_PASSWORD:-mosgarage};Pooling=true;"
      MOSGARAGE_SECRET_KEY:           "${MOSGARAGE_SECRET_KEY:-dev-secret-key-change-in-production-32c}"
      MOSGARAGE_ADMIN_EMAIL:          "${MOSGARAGE_ADMIN_EMAIL:-admin@mosgarage.local}"
      MOSGARAGE_ADMIN_PASSWORD:       "${MOSGARAGE_ADMIN_PASSWORD:-changeme}"
      MOSGARAGE_PROVISIONER:          docker
      MOSGARAGE_WORKSPACE_NETWORK:    mosgarage-net
      MOSGARAGE_WORKSPACE_IMAGE:      "docker.io/mosgarage/workspace:latest"
      MOSGARAGE_ENV:                  development
      MOSGARAGE_TELEMETRY:            "false"

      # ── GitHub ───────────────────────────────────────────────────
      GITHUB_USER:                    "${GITHUB_USER:-mosgaragedev}"
      GITHUB_ORG:                     "${GITHUB_ORG:-mosgarage}"
      GITHUB_REPO:                    "${GITHUB_REPO:-mosgaragedev}"
      GITHUB_TOKEN:                   "${GITHUB_TOKEN:-}"
      GIT_BRANCH:                     "${GIT_BRANCH:-main}"

      # ── Entra ID ─────────────────────────────────────────────────
      ENTRA_TENANT_ID:                "${ENTRA_TENANT_ID:-}"
      ENTRA_CLIENT_ID:                "${ENTRA_CLIENT_ID:-}"
      ENTRA_CLIENT_SECRET:            "${ENTRA_CLIENT_SECRET:-}"
      ENTRA_AUDIENCE:                 "${ENTRA_AUDIENCE:-}"

    depends_on:
      database:
        condition: service_healthy

    # Port forwards surfaced to the editor
    ports:
      - "7070:7070"   # control plane
      - "7071:7071"   # agent
      - "2222:2222"   # SSH

    # No restart — editor manages the lifecycle
    restart: "no"

volumes:
  nuget-cache:
    name: mosgarage_nuget_cache
  dotnet-tools:
    name: mosgarage_dotnet_tools
  npm-cache:
    name: mosgarage_npm_cache
  zsh-history:
    name: mosgarage_zsh_history
