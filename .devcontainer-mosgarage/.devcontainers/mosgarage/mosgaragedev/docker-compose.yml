# ============================================================
# mosgarage/mosgarage — Docker Compose
# Usage:  docker compose up -d
#         docker compose logs -f
#         docker compose down
# ============================================================

services:
  mosgarage:
    image: docker.io/mosgarage/mosgarage:latest
    container_name: mosgarage
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # ── Port mapping ─────────────────────────────────────────
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"   # code-server  (VS Code)
      - "${NODE_SERVER_PORT:-3000}:3000"   # node-server  (HTTP + WS)
      - "${API_PORT:-4000}:4000"           # api-server   (REST)

    # ── Environment ──────────────────────────────────────────
    environment:
      CODE_SERVER_PASSWORD: ${CODE_SERVER_PASSWORD:-mosgarage}
      CODE_SERVER_PORT:     ${CODE_SERVER_PORT:-8080}
      NODE_SERVER_PORT:     ${NODE_SERVER_PORT:-3000}
      API_PORT:             ${API_PORT:-4000}
      NODE_ENV:             ${NODE_ENV:-production}
      API_KEY:              ${API_KEY:-}        # leave blank = open

    # ── Volumes ──────────────────────────────────────────────
    volumes:
      - mosgarage-workspace:/app/workspace     # persistent workspace
      - mosgarage-code-server:/home/mosgarage/.code-server  # VS Code settings + extensions
      - mosgarage-logs:/var/log/mosgarage      # persistent logs

    # ── Health check ─────────────────────────────────────────
    healthcheck:
      test: |
        curl -sf http://localhost:3000/status &&
        curl -sf http://localhost:4000/api/v1/health
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 20s

    # ── Resource limits ──────────────────────────────────────
    deploy:
      resources:
        limits:
          memory: 2g
          cpus:   "2.0"
        reservations:
          memory: 512m

    # ── Security ─────────────────────────────────────────────
    security_opt:
      - no-new-privileges:true

    # ── Logging ──────────────────────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  mosgarage-workspace:
    name: mosgarage-workspace
  mosgarage-code-server:
    name: mosgarage-code-server
  mosgarage-logs:
    name: mosgarage-logs
