# /etc/wsl.conf
# Place this file inside your WSL2 distro at /etc/wsl.conf
# Then run: wsl --shutdown  (from PowerShell) and relaunch WSL2

[boot]
# Enable systemd — required for Docker Engine to run as a proper service
systemd = true

[automount]
enabled = true
root    = /mnt
options = "metadata,umask=22,fmask=11"

[interop]
enabled            = true
appendWindowsPath  = true

[user]
# Replace 'mo' with your actual Linux username
default = mo

[wsl2]
# Limit WSL2 memory — adjust to taste (you have 16 GB total)
memory = 10GB
processors = 4

# NOTE: GPU passthrough (/dev/dri) is automatic when the Windows Intel
# graphics driver supports WSL2 (v27.20.100.9079+).
# No wsl.conf setting is required — update the driver on the Windows side.
